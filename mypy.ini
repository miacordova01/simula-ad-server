[mypy]
python_version = 3.12
ignore_missing_imports = True
no_strict_optional = True
warn_unused_ignores = True
check_untyped_defs = True

# redis-py ships one set of stubs for both the sync and async clients, so every
# awaited call types as `Awaitable[T] | T`. The code is correct; the stubs
# cannot express it. Scope the suppression to that one error code.
[mypy-app.services.features]
disable_error_code = misc

[mypy-app.services.sessions]
disable_error_code = misc

[mypy-app.services.campaign_cache]
disable_error_code = misc

[mypy-app.services.serving]
disable_error_code = misc
