line-length = 95
target-version = "py312"

[lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = [
  "E501",    # line length is handled by the formatter
  "B008",    # FastAPI's Depends()/Query() in defaults is the framework idiom
  "RUF012",  # mutable class attrs: pydantic models handle this
]

[lint.per-file-ignores]
"tests/*" = ["S101", "C408"]  # dict(...) kwargs read better in fixture builders
